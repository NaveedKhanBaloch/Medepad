# Runs the whole Medepad Admin system: PostgreSQL + admin API + admin website.
#   1. Copy backend/.env.example to backend/.env and fill in JWT_SECRET and GEMINI_API_KEY.
#   2. docker compose up --build -d
#   3. Open http://localhost:3001
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medepad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medepad}
      POSTGRES_DB: medepad_admin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medepad -d medepad_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://medepad:${POSTGRES_PASSWORD:-medepad}@db:5432/medepad_admin
      CORS_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8001}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3001"

volumes:
  pgdata:
